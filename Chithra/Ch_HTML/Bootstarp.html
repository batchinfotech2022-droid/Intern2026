<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-info">
    <div class="text-center">
    <h1 class="display-1">Welcome to Bi</h1></div>
    <div class="row">
        <div class="col-md-4"></div>
        <div class="col-md-4">
    
<div class="card">
  <img src="images/i1.jpg" class="card-img-top" alt="Batch Infotech">
  <div class="card-body">
    <h5 class="card-title">LOGIN</h5>
    <div class="row">
<form>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Email address</label>
    <input type="email" class="form-control" id="txtemail" aria-describedby="emailHelp" required/>

    <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Password</label>
    <input type="password" class="form-control" id="exampleInputPassword1">
  </div>
  <button type="button" class="btn btn-success" onclick="showMe();">Click me</button>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
</div>
</div>
</div>
<div class="col-md-4"></div>
   </div>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript">
function showMe() {
    var email = document.getElementById("txtemail");
    console.log(email.value);
}

    </script>
  </body>
</html>
