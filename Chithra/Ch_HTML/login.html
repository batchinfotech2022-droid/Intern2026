<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="css/bootstrap.flaty.min.css" rel="stylesheet">
  <style>
    .card {
      display: flex;
      justify-content: center;
      /* Centers the image horizontally */
      align-items: center;
      /* Centers the image vertically (if the card has a defined height) */
      /* Add other card styling like width, height, border, etc. */
    }

    .container {
      position: relative;
      text-align: center;
      color: white;
    }

    .centered {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>

<body>

  <div class="row">
    <div class="col-md-6 mt-5">
      <video autoplay muted loop playsinline>
        <source src="images/vi.webm" type="video/mp4">
      </video>
    </div>
    <div class="col-md-6 pt-5">
      <div class="card card shadow-lg" style="width: 27rem ;">
        <img class="card-img-top" src="images/signbanner.jpg" alt="Card image cap"
          style="height: 175px;opacity: 0.6;" />

        <form>
          <div class="mb-3">
            <div class="form-floating mb-3 mt-3">
              <input type="text" size="30" maxlength="50" class="form-control" id="floatingInput"
                placeholder="name@example" style="outline-style:auto; " required>
              <label for="floatingInput">User Name</label>

            </div>


          </div>
          <div class="mb-3">
            <div class="form-floating mb-3">
              <input type="email" size="30" maxlength="50" class="form-control" id="floatingInput"
                placeholder="name@example.com" style="outline-style:auto; " required>
              <label for="floatingInput">E-mail</label>
            </div>
          </div>

          <div class="mb-3">
            <div class="form-floating mb-3">
              <input type="password" maxlength="20" class="form-control" id="floatingInput" placeholder="er44"
                style="outline-style:auto;" required>
              <label for="floatingInput">Password</label>
            </div>
          </div>

          <div class="d-grid mt-3 mb-3">
            <button class="btn btn-primary" onclick="myFunction()" type="button" id="sign in">Sign in</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  </div>
  </div>
  <nav class="breadcrumb">
    <a href="project.html" style="margin-top:7%;">Back to Home</a>
  </nav>

  </div>
  </div>
  <script src="js/bootstrap.bundle.min.js"></script>

  <script>
    function myFunction() {
      alert("Signed in Successfully!!");
    }
  </script>

</body>

</html>
