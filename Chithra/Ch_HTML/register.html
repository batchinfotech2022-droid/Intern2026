<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bootstrap demo</title>
  <link href="css/bootstrap.flaty.min.css" rel="stylesheet" />
  <style>
    .card {
      display: flex;
      justify-content: center;
      /* Centers the image horizontally */
      align-items: center;
      /* Centers the image vertically (if the card has a defined height) */
      /* Add other card styling like width, height, border, etc. */
    }

    .container {
      position: relative;
      text-align: center;
      color: white;
    }

    .centered {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #banner-container {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 100%;
      transform: translateY(-50%);
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    #banner {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 2rem;
      color: white;
      animation: floatText 15s linear infinite;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }


    @keyframes floatText {
      0% {
        left: 50%;
        transform: translateX(-50%);
      }

      25% {
        left: 90%;
        transform: translateX(-100%);
      }

      50% {
        left: 50%;
        transform: translateX(-50%);
      }

      75% {
        left: 10%;
        transform: translateX(0);
      }

      100% {
        left: 50%;
        transform: translateX(-50%);
      }
    }




    .top-banner {
      width: 100%;
      height: 120px;
      /* 🔧 CHANGE HEIGHT HERE */
      position: relative;

      overflow: hidden;
    }

    .top-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Prevents stretching */
    }
  </style>
</head>

<body>
  <div class="top-banner">
    <img src="images/back.jpg" alt="Banner Image">
    <div id="banner-container">
      <div id="banner">Register Now!</div>
    </div>
  </div>
  </div>
  <div class="row">
    <div class="col-md-4"></div>
    <div class="col-md-6 mt-3">
      <div class="card  card shadow-lg" style="width: 25rem ;">
        <img class="card-img-top" src="images/profile1.jpg" alt="Card image cap" style="height: 175px;" />

        <form>
          <div class="mb-3">
            <div class="form-floating mb-3">
              <input type="text" maxlength="100" class="form-control" id="floatingInput" placeholder="name@example.com"
                style="outline-style:auto;
                " required>
              <label for="floatingInput">First Name</label>
            </div>
          </div>

          <div class="mb-3">
            <div class="form-floating mb-3">
              <input type="text" size="30" maxlength="50" class="form-control" id="floatingInput"
                placeholder="name@example.com" style="outline-style:auto; ">
              <label for="floatingInput">User Name</label>

            </div>
          </div>
          <div class="mb-3">
            <div class="form-floating mb-3">
              <input type="password" maxlength="20" class="form-control" id="floatingInput"
                placeholder="name@example.com" style="outline-style:auto;
                " required>
              <label for="floatingInput">Password</label>
            </div>
          </div>
          <label for="exampleInpuName1" class="form-label">Role</label>
          <div class="form-check">

            <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1" />

            <label class="form-check-label" for="radioDefault1">
              Intern
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2" checked />
            <label class="form-check-label" for="radioDefault2">
              Admin
            </label>
          </div>
          <div class="d-grid mt-3 mb-3">
            <button class="btn btn-primary" onclick="myFunction()" type="button" id="register">Register</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="col-md-3"></div>
  </div>
  </div>
  <nav class="breadcrumb">
    <a href="project.html" style="margin-top:0%;">Back to Home</a>
  </nav>
  <script src="js/bootstrap.bundle.min.js"></script>
  <script>
    function myFunction() {
      alert("Registration Completed!!");
    }

  </script>

</body>

</html>
