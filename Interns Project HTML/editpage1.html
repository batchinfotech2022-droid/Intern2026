<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Edit Leave</title>
  <link href="css/bootswatchjj.min.css.css" rel="stylesheet">
  <link rel="stylesheet" href="stylesheet.css">
</head>
<body>

<div class="container mt-3" style="max-width:600px;">
  <h5 class="mb-3 text-center">Edit Leave</h5>

  <form class="card p-3 shadow-sm">

    <div class="mb-2">
      <label class="form-label">Leave Code</label>
      <input type="text" class="form-control form-control-sm" value="01" readonly>
    </div>

    <div class="mb-2">
      <label class="form-label">Leave Type</label>
      <select class="form-select form-select-sm">
        <option selected>Sick</option>
        <option>Casual</option>
        <option>Earned</option>
      </select>
    </div>

    <div class="mb-2">
      <label class="form-label">From Date</label>
      <input type="date" class="form-control form-control-sm" value="2026-02-10">
    </div>

    <div class="mb-2">
      <label class="form-label">To Date</label>
      <input type="date" class="form-control form-control-sm" value="2026-02-12">
    </div>

    <div class="mb-2">
      <label class="form-label">Total Days</label>
      <input type="number" class="form-control form-control-sm" value="3">
    </div>

    <div class="mb-2">
      <label class="form-label">Reason</label>
      <input type="text" class="form-control form-control-sm" value="Fever & Doctor Visit">
    </div>

    <div class="mb-3">
      <label class="form-label">Status</label>
      <select class="form-select form-select-sm">
        <option selected>Pending</option>
        <option>Approved</option>
        <option>Rejected</option>
      </select>
    </div>

    <div class="d-flex justify-content-between">
      <a href="table.html" class="btn btn-sm btn-outline-secondary">Cancel</a>
      <button class="btn btn-sm btn-primary">Update</button>
    </div>

  </form>
</div>

</body>
</html>
