    <div class="container my-5" id="addcontactsec">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-sm-10">
            <div class="card shadow">
            <div class="card-body">
                <h2 class="p-3 bg-info text-center text-white mt-3">Delete Contacts</h2>
                <form class="form-floating">
                    <div class="row g-3">
                        <div class="col-12"> <label for="floatingInputValue">CategoryId</label>
                            <input class="form-control" type="number" id="floatingInputValue" value="110" disabled>
                        </div>

                        <div class="col-12"> <label for="floatingInputValue">FullName</label>
                            <input type="text" class="form-control" id="floatingInputValue" placeholder="Aditi"
                                value="Aditi" disabled>
                        </div>

                        <div class="col-12"> <label for="floatingInputValue">Email</label>
                            <input type="email" class="form-control" id="floatingInputValue" placeholder=""
                                value="Aditi123@gmail.com" disabled>
                        </div>

                        <div class="col-12"> <label for="floatingInputValue">Phone Number</label>
                            <input type="number" class="form-control" id="floatingInputValue" placeholder=""
                                value="778926522" disabled>
                        </div>

                        <div class="col-12"> <label for="floatingInputValue">City</label>
                            <input type="text" class="form-control" id="floatingInputValue" placeholder=""
                                value="Hebri" disabled>
                        </div>


                        <!--delete button with modal-->
                        <div class="d-flex justify-content-center">
                            <button type="button" class="btn btn-primary" data-bs-toggle="modal"
                                data-bs-target="#staticBackdrop">
                                Delete
                            </button>

                            <!-- Modal -->
                            <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static"
                                data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel"
                                aria-hidden="true">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h1 class="modal-title fs-5" id="staticBackdropLabel">Modal title</h1>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal"
                                                aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body">
                                            ...
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary"
                                                data-bs-dismiss="modal">Close</button>
                                            <button type="button" class="btn btn-primary">Understood</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                </form>
