<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Delete Leave</title>
  <link href="css/bootswatchjj.min.css.css" rel="stylesheet">
  <link rel="stylesheet" href="stylesheet.css">
</head>
<body>

<div class="container mt-3" style="max-width:600px;">
  <h5 class="mb-3 text-center">Delete Leave</h5>

  <form class="card p-3 shadow-sm ">

    <div class="mb-2">
      <label class="form-label">Leave Code</label>
      <input type="text" class="form-control form-control-sm" value="01" readonly>
    </div>

    <div class="mb-2">
      <label class="form-label">Leave Type</label>
      <input type="text" class="form-control form-control-sm" value="Sick" readonly>
    </div>

    <div class="mb-2">
      <label class="form-label">From Date</label>
      <input type="text" class="form-control form-control-sm" value="10-02-2026" readonly>
    </div>

    <div class="mb-2">
      <label class="form-label">To Date</label>
      <input type="text" class="form-control form-control-sm" value="12-02-2026" readonly>
    </div>

    <div class="mb-2">
      <label class="form-label">Total Days</label>
      <input type="text" class="form-control form-control-sm" value="3" readonly>
    </div>

    <div class="mb-3">
      <label class="form-label">Reason</label>
      <input type="text" class="form-control form-control-sm" value="Fever & Doctor Visit" readonly>
    </div>

    <div class="alert alert-danger py-2 mb-3">
      Are you sure you want to delete this leave record?
    </div>

    <div class="d-flex justify-content-between">
      <a href="table.html" class="btn btn-sm btn-outline-secondary">Cancel</a>
      <button class="btn btn-sm btn-danger">Confirm Delete</button>
    </div>

  </form>
</div>

</body>
</html>
