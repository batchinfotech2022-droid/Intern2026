<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Intern Attendance System</title>

    <!-- Bootstrap CSS -->
    <link href="css/bootswatchjj.min.css.css" rel="stylesheet">
    <link rel="stylesheet" href="stylesheet.css">
    <link rel="stylesheet" href="icons/bootstrap-icons.css">
</head>

<body>

    <div class="container login-container">
        <div class="row justify-content-center align-items-center min-vh-100">

            <!-- Image Section -->
            <div class="col-md-6 d-none d-md-block">
                <img src="https://static.vecteezy.com/system/resources/previews/010/925/508/non_2x/task-management-project-manager-tool-business-software-productivity-online-platform-task-management-application-progress-tracking-flat-design-modern-illustration-vector.jpg" 
                     class="img-fluid rounded" alt="Login Illustration">
            </div>

            <!-- Login Form Section -->
            <div class="col-md-6">
                <div class="login-box content-box">
                    <h3 class="text-center mb-4">Welcome Back!</h3>
                    <p class="text-center mb-4">Login to access the Intern Attendance System</p>

                    <form>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="Enter your email">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="Enter your password">
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary">Login</button>
                        </div>

                        <div class="text-center">
                            <a href="#" class="text-decoration-none">Forgot Password?</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
