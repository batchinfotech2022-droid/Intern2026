<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leave Application</title>

    <link href="css/bootswatchjj.min.css.css" rel="stylesheet">
    <link rel="stylesheet" href="stylesheet.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">

            <a class="navbar-brand d-flex align-items-center" href="mainpage.html">
                <img src="https://cdn.vectorstock.com/i/1000v/83/29/ss-or-s-initial-letter-logo-design-vector-41418329.jpg"
                    width="30" height="30" class="me-2">

            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="mainpage.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Action</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Contact</a>
                    </li>
                    
                </ul>

                <a href="loginpage.html" class="btn btn-primary btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-xl-5 col-lg-6 col-md-8 col-sm-10">

                <div class="card shadow-sm mx-auto">
                    <div class="card-body">

                        <h5 class="text-center mb-3">Leave Application</h5>

                        <form>

                            <div class="mb-3">
                                <label class="form-label">Intern ID</label>
                                <input type="number" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Leave Type</label>
                                <select class="form-select" required>
                                    <option value="">Select Leave Type</option>
                                    <option>Casual Leave</option>
                                    <option>Medical Leave</option>
                                    <option>Annual Leave</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">From Date</label>
                                <input type="date" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">To Date</label>
                                <input type="date" class="form-control" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Reason</label>
                                <textarea class="form-control" rows="3"></textarea>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a href="mainpage.html" class="btn btn-primary btn-sm">Back to Home</a>
                                <button type="submit" class="btn btn-success btn-sm">Apply Leave</button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <footer class="bg-success-subtle text-center fixed-bottom py-2 small sitefooter">
        © 2026 Intern Attendance System
    </footer>

    <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
