<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="css/bootswatchjj.min.css.css" rel="stylesheet">


</head>

<body style="margin: auto;padding: 12px;font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;">
    <div>
        <h1 style="text-align: center;">Leave Application!</h1>
        <form>

            <div class="row">
                <div class="col-md-3"></div>
                <div class="col-md-5 mt-3 mb-3">
                    <select class="form-select" aria-label="Default select example">
                        <option selected>Select Intern</option>
                        <option value="1">Intern 1</option>
                        <option value="2">Intern 2</option>
                        <option value="3">Intern 3</option>
                    </select>
                </div>
            </div>
            <div class="row mb-3 mt-3">
                <div class="col-md-3"></div>
                <div class="col-md-5 mt-3 mb-3">
                    <label>
                        Leave From:</label>
                    <input type="date" name="From" />
                </div>
            </div>
            <div class="row mb-3 mt-3">
                <div class="col-md-3"></div>
                <div class="col-md-5 mt-3 mb-3">
                    <label>Leave To:</label>
                    <input type="date" name="To" />
                </div>
            </div>
            <div class="row mb-3 mt-3">
                <div class="col-md-3"></div>
                <div class="col-md-5 mt-3 mb-3">
                    <label for="Textarea" class="form-label">Reason for the Leave :</label>
  <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                </div>
            </div>

<div class="d-grid gap-2 col-3 mx-auto">
  <button class="btn btn-primary" type="button">Submit</button>
  
</div>

        </form>
    </div>



    <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
