<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Contacts</title>

    <link href="css/bootstrapflaty.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg custom-navbar">
    <div class="container-fluid">

        <img src="images/logo.png" class="navbar-logo" alt="Logo">

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="#">HOME</a></li>
                <li class="nav-item"><a class="nav-link" href="viewcontacts.html">VIEW CONTACTS</a></li>
                <li class="nav-item"><a class="nav-link" href="addcontacts.html">ADD CONTACTS</a></li>
                <li class="nav-item"><a class="nav-link" href="category.html">CATEGORY</a></li>
            </ul>

            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="btn btn-link" href="login.html">LOGIN</a>
                </li>
            </ul>
        </div>
    </div>
</nav>


<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">

            <div class="card shadow">
                <div class="card-body">

                    <h2 class="p-3 bg-danger text-center text-white rounded">
                        Add Contacts
                    </h2>

                    <form class="needs-validation mt-4" novalidate>
                        <div class="row g-3">

                            <div class="col-12">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" placeholder="Enter Full Name" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" placeholder="you@example.com" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Phone Number</label>
                                <input type="number" class="form-control" placeholder="Enter Phone Number" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label">City</label>
                                <input type="text" class="form-control" placeholder="Enter City" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Category</label>
                                <select class="form-select" required>
                                    <option value="">Select Category</option>
                                    <option>Family</option>
                                    <option>Friends</option>
                                    <option>College</option>
                                    <option>Vendor</option>
                                    <option>Clients</option>
                                </select>
                            </div>

                            <div class="d-flex justify-content-center">
                                <button class="btn btn-primary" type="submit">
                                    Submit
                                </button>
                            </div>

                        </div>
                    </form>
                     </div>
            </div>

                    <a href="dashboard.html" class="back-btn mt-3 d-inline-block">
                        <strong>← Back</strong>
                    </a>

               

        </div>
    </div>
</div>


<div class="bg-success-subtle p-3 text-center fixed-bottom">
    <span>Copyright 2026 SK</span>
</div>

<script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
