<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Contact Manager</title>

    <link href="css/bootstraplux.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center login-wrapper">

    <div class="row w-100 justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-4">

            <div class="card shadow">
                <h2 class="text-center p-4 login-title">LogIn</h2>

                <form class="px-4 py-4">

                    <div class="mb-4">
                        <label class="form-label">Email address</label>
                        <input type="email" class="form-control"
                               placeholder="email@example.com">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control"
                               placeholder="Password">
                    </div>

                    <div class="d-flex justify-content-center mb-3">
                        <button class="btn btn-primary">Log in</button>
                    </div>

                
                

                </form>
            

       
        
                    <div class="text-start">
                        <a href="dashboard.html" class="back-btn">
                            <strong>← Back</strong>
                        </a>
                    </div>
                     </div>
                      </div>
                    
    </div>

</div>

<script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
