</head>

<body>


    <nav class="navbar navbar-expand-lg" style="background-color: #e3f2fd;"">
            <div class=" container-fluid">
        <img src="logo.png" style="width:70px;height:70px;">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav  mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link" href="#">HOME</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="viewcontacts.html">VIEW CONTACTS</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="addcontacts.html">ADD CONTACTS</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">CATEGORY</a>
                </li>

            </ul>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="btn btn-link" href="login.html">LOGIN</a>
                </li>
            </ul>
        </div>
        </div>
    </nav>


    <div class="container my-5" id="addcontactsec">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-sm-10">
            <div class="card shadow">
            <div class="card-body">
                <h2 class="addcontacts p-3 bg-danger text-center text-white mt-3">Add Contacts</h2>
                <form class="needs-validation" novalidate>
                    <div class="row g-3">
                        <div class="col-12"> <label for="fullName" class="form-label">First name</label> <input
                                type="text" class="form-control" id="fullName" placeholder="Enter FullName" value=""
                                required>
                            <div class="invalid-feedback">
                                Valid full name is required.
                            </div>
                        </div>

                        <div class="col-12"> <label for="email" class="form-label">Email </label>
                            <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
                            <div class="invalid-feedback">
                                Please enter a valid email.
                            </div>
                        </div>

                        <div class="col-12"> <label for="phonenumber" class="form-label">Phone Number</label> <input
                                type="number" class="form-control" id="phonenumber" placeholder="Enter a Phone Number"
                                required>
                            <div class="invalid-feedback">
                                Please enter your Phone Number.
                            </div>
                        </div>

                        <div class="col-12"> <label for="address" class="form-label">City</label> <input type="text"
                                class="form-control" id="city" placeholder="Enter a City" required>
                            <div class="invalid-feedback">
                                Please enter your City Name.
                            </div>
                        </div>

                        <div class="col-12"> <label for="country" class="form-label">Category</label> <select
                                class="form-select" id="country" required>
                                <option value="">Select Category</option>
                                <option value="1">Family</option>
                                <option value="2">Friends</option>
                                <option value="3">College</option>
                                <option value="4">Vendor</option>
                                <option value="5">Clients</option>
                            </select>
                            <div class="invalid-feedback">
                                Please select any Category
                            </div>
                        </div>



                        <div class="d-flex justify-content-center">
                            <button class="btn btn-primary " type="submit">Submit </button>
                        </div>
                    </div>
                </form>
                <a href="dashboard.html" class="back-btn" style="background-color:rgb(187, 194, 238);"><strong>← Back</strong></a>
            </div>
        </div>

    </div>
    </div>
    </div>

    <div class="bg-success-subtle p-3 text-center fixed-bottom">
        <span>Copyright 2026 SK</span>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
